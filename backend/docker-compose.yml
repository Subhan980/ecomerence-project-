services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop_password
      POSTGRES_DB: shop
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
  api:
    build: .
    environment:
      DATABASE_URL: postgres://shop:shop_password@db:5432/shop
      JWT_SECRET: change-this-secret
    ports:
      - "3000:3000"
    depends_on:
      - db
volumes:
  pgdata:
